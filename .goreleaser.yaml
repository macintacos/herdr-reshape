# Builds the release artifacts and publishes the Homebrew cask that installs
# them on macOS. Linux gets archives and no brew path — see the cask block.
# Releases are cut from a laptop rather than CI, so docs/RELEASING.md carries
# the half this file cannot: the tag, the token, and the checks that need a real
# herdr session to make.
# https://goreleaser.com
version: 2
project_name: herdr-reshape
before:
  hooks:
    # First, because it is the gate: herdr reads the manifest's own `version`,
    # not the tag, so a tag that disagrees with it publishes a release claiming
    # to be a version nobody can see. Costs milliseconds and needs no network,
    # which is the other reason it comes before the download.
    - ./.mise/tasks/version-check {{ .Version }} {{ .IsSnapshot }}
    - go mod download
builds:
  - env:
      # Every release cross-compiles three of its four targets from one machine.
      - CGO_ENABLED=0
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    # -s -w is what a Homebrew formula's std_go_args passes by default, and
    # main.version is what `herdr-reshape --version` reports. This restates
    # goreleaser's own default on purpose rather than inheriting it — the stamp
    # is load-bearing, and a default that quietly changed would leave every
    # release reporting "dev" with nothing to notice it by.
    ldflags:
      - -s -w -X main.version={{ .Version }}
    # A path, not just a name: it is what makes the extracted archive a plugin
    # root herdr can load — `bin/herdr-reshape` beside `herdr-plugin.toml`, the
    # layout the manifest's actions and events assume when they exec
    # `./bin/herdr-reshape`. A binary at the archive root would leave the tree
    # one level short and herdr would find no manifest beside it.
    #
    # Two defaults hold this up, so leave both alone: strip_binary_directory
    # would flatten the path back out of the archive, and wrap_in_directory
    # would nest the tree one level deeper than the `install` stanza looks.
    binary: bin/herdr-reshape
archives:
  # Naming `files` replaces goreleaser's defaults rather than adding to them, so
  # LICENSE is listed back explicitly — MIT requires the notice travel with the
  # binary — and README.md with it. The manifest, beside bin/, is what makes the
  # extracted tree a plugin root herdr can actually load.
  - files:
      - herdr-plugin.toml
      - LICENSE
      - README.md
homebrew_casks:
  # A cask, because it is what goreleaser supports going forward: `brews` is
  # deprecated and survives only until goreleaser v3. Its sha256 per
  # architecture is read from the checksums.txt goreleaser generates by default,
  # so it covers the binary the user actually runs rather than source someone
  # else's toolchain rebuilt.
  #
  # Casks are macOS-only — Homebrew on Linux refuses to install one at all — so
  # the linux archives above are what Linux installs from: extracted by hand and
  # registered with `herdr plugin link`, which works because an archive is
  # already a plugin root. Not `herdr plugin install`, which takes a GitHub
  # owner/repo and compiles the manifest's [[build]] from source rather than
  # consuming a release artifact. There is no brew path on Linux, and no
  # arrangement of this block creates one.
  - repository:
      owner: macintacos
      name: homebrew-tap
    homepage: https://github.com/macintacos/herdr-reshape
    description: Move the focused herdr pane, and best-fit a tab into an even grid
    license: MIT
    # Spelled out because goreleaser derives the cask's `binary` stanza from the
    # base name alone, which would point Homebrew at a herdr-reshape sitting at
    # the top of the staged directory — where the archive deliberately does not
    # put it. The symlink it makes still lands on PATH as `herdr-reshape`; only
    # its target changes.
    binaries:
      - bin/herdr-reshape
    # herdr is what loads the plugin, so it is not optional. Nothing else is
    # needed: this plugin drives herdr's socket and nothing but. It is a
    # homebrew/core formula and bottled, so this resolves without a source
    # build.
    dependencies:
      - formula: herdr
    # No `zap` stanza for the plugin root the post-install hook maintains, even
    # though that is the one path brew will not remove on its own. Both `trash`
    # and `delete` route a path outside $HOME through `sudo rm`, measured — so a
    # zap would prompt for a password to delete a user-owned directory, and fail
    # outright wherever sudo cannot prompt. The removal is one `rm -rf` the user
    # can read, so the caveats spell it out instead.
    # A cask cannot bind a key, and this one deliberately does not register the
    # plugin either — that would run herdr from a hook whose environment brew
    # has already filtered (see below), to save a step taken once. So both are
    # spelled out here. The registration is one-time: every upgrade rewrites
    # what sits behind the path herdr recorded, so there is nothing to re-run.
    caveats: |
      Bind the five actions in ~/.config/herdr/config.toml, one block each:

        [[keys.command]]
        key         = "prefix+="
        type        = "plugin_action"
        command     = "user.reshape.fit"
        description = "best-fit the tab"

      The other four action ids are user.reshape.move-left,
      user.reshape.move-right, user.reshape.move-up and
      user.reshape.move-down. Apply them with:

        herdr server reload-config

      Then register the plugin with herdr — once, not per upgrade.
      Every upgrade refreshes what sits behind this path:

        herdr plugin link "$(brew --prefix)/share/herdr-reshape"

      Removing it takes three steps, because brew owns only the
      first: the plugin root is written by this cask's own
      post-install rather than installed by brew, and herdr's
      registration outlives the uninstall either way.

        brew uninstall --cask herdr-reshape
        herdr plugin unlink user.reshape
        rm -rf "$(brew --prefix)/share/herdr-reshape"
    hooks:
      post:
        # Two jobs, and the second is the whole reason this cask installs
        # cleanly across an upgrade.
        #
        # Homebrew quarantines whatever a cask downloads, and macOS refuses to
        # run a quarantined binary from a developer it cannot identify — so
        # without the strip, the `herdr-reshape` the `binary` stanza puts on
        # PATH will not launch. The `-h` probe is not defensive padding: xattr
        # was a /usr/bin/python3 script until recently, and on a machine without
        # the Command Line Tools it fails rather than runs. goreleaser's own
        # docs ship the guard for that reason — a cask that cannot strip the
        # attribute should still install.
        #
        # The copy is what herdr actually runs. A cask stages into a Caskroom
        # path numbered by version, which the next upgrade deletes, so herdr —
        # which records a plugin by the *resolved* directory holding its
        # manifest — cannot be pointed there. It gets share/herdr-reshape
        # instead, a real directory that is never renumbered, refreshed on every
        # install and every upgrade. That is what makes `herdr plugin link` a
        # one-time step rather than something to re-run after each upgrade.
        #
        # Copying rather than symlinking, and with plain reads and writes:
        # FileUtils carries no extended attributes, so the tree herdr loads
        # comes out unquarantined regardless of what the strip above did.
        #
        # Removing before the copy replaces rather than merges, so a file a
        # release stopped shipping does not linger in the root forever — herdr
        # would keep finding it, and nothing else would remove it. `rm_r`
        # guarded by exist? rather than the shorter rm_rf: `brew style` rejects
        # rm_rf outright, and the guard keeps a genuine removal failure loud
        # instead of swallowed.
        install: |
          if system_command("/usr/bin/xattr", args: ["-h"]).exit_status == 0
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/bin/herdr-reshape"]
          end
          root = Pathname.new("#{HOMEBREW_PREFIX}/share/herdr-reshape")
          FileUtils.rm_r(root) if root.exist?
          root.mkpath
          FileUtils.cp_r(["#{staged_path}/bin", "#{staged_path}/herdr-plugin.toml"], root)
